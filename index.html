<!doctype html>
<html lang="uz" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude Terminal</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1F1E1D; --sidebar:#262624; --panel:#2C2B29; --panel-2:#333230; --raise:#3A3936;
    --ink:#ECE9DF; --ink-2:#B9B5A8; --slate:#8A867A; --line:#3A3937;
    --clay:#D97757; --clay-dim:#C4623F; --good:#8FA96C; --warn:#D6A85C;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
    --ui:"Inter",system-ui,-apple-system,sans-serif;
    --disp:"Fraunces",Georgia,serif;
  }
  :root[data-theme="light"]{
    --bg:#F5F4EE; --sidebar:#EFEEE7; --panel:#FBFAF6; --panel-2:#F1EFE8; --raise:#EAE8DF;
    --ink:#2A2A26; --ink-2:#54524B; --slate:#7C7A70; --line:#E2DFD4;
    --clay:#C4623F; --clay-dim:#A8502F; --good:#5E7C46; --warn:#B07E2E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14.5px;line-height:1.6;overflow:hidden;-webkit-font-smoothing:antialiased}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--raise);border-radius:9px}
  button{font-family:inherit;color:inherit;cursor:pointer}

  .app{display:flex;height:100%;padding-top:env(safe-area-inset-top)}

  /* ---------- sidebar ---------- */
  aside{width:270px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:margin-left .26s cubic-bezier(.2,.7,.3,1)}
  aside.collapsed{margin-left:-271px}
  .s-head{display:flex;align-items:center;gap:9px;padding:14px 14px 10px}
  .s-head .logo{font-family:var(--disp);font-weight:500;font-size:16px;letter-spacing:-.01em;flex:1;display:flex;align-items:center;gap:7px}
  .star{width:15px;height:15px;color:var(--clay);flex-shrink:0}
  .icon-btn{background:none;border:none;color:var(--slate);padding:6px;border-radius:8px;line-height:0;display:inline-flex}
  .icon-btn:hover{color:var(--ink);background:var(--panel-2)}

  .new-btn{margin:4px 12px 10px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:11px;
    display:flex;align-items:center;gap:9px;font-weight:500;font-size:13.5px;transition:.14s}
  .new-btn:hover{border-color:var(--clay);background:var(--panel-2)}
  .new-btn svg{color:var(--clay)}

  .nav{padding:0 8px}
  .nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;color:var(--ink-2);font-size:13.5px;transition:.12s}
  .nav a:hover{background:var(--panel-2);color:var(--ink)}
  .nav a.active{background:var(--panel-2);color:var(--ink)}
  .nav a svg{width:16px;height:16px;flex-shrink:0;opacity:.85}
  .nav a .badge{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--slate);background:var(--raise);padding:1px 6px;border-radius:99px}

  .s-label{padding:16px 16px 6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate)}
  .s-list{flex:1;overflow-y:auto;padding:0 8px 10px}
  .sess{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:9px;transition:background .12s}
  .sess:hover{background:var(--panel-2)}
  .sess.active{background:var(--panel-2);box-shadow:inset 2px 0 0 var(--clay)}
  .sess .t{font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sess .m{font-family:var(--mono);font-size:9.5px;color:var(--slate)}

  .s-foot{border-top:1px solid var(--line);padding:11px 14px;display:flex;align-items:center;gap:10px;font-size:12.5px}
  .s-foot .av{width:26px;height:26px;border-radius:8px;background:var(--clay);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px}
  .s-foot .dot{width:7px;height:7px;border-radius:50%;background:var(--good);margin-left:auto}
  .s-foot .dot.off{background:var(--warn)}

  /* ---------- main ---------- */
  main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
  .topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid transparent}
  .topbar .burger{display:none}
  .topbar .ttl{font-family:var(--disp);font-size:14px;color:var(--ink-2)}
  .spring{flex:1}
  .meter{display:flex;flex-direction:column;gap:3px;width:110px}
  .meter .track{height:4px;background:var(--panel-2);border-radius:99px;overflow:hidden}
  .meter .fill{height:100%;width:0;background:linear-gradient(90deg,var(--clay-dim),var(--clay));transition:width .5s cubic-bezier(.2,.7,.3,1)}
  .meter.fold .fill{animation:fold .7s cubic-bezier(.5,-.3,.3,1.3)}
  @keyframes fold{45%{transform:scaleX(.05);filter:brightness(1.7)}}
  .meter .lbl{font-family:var(--mono);font-size:9px;color:var(--slate)}

  .scroll{flex:1;overflow-y:auto}
  .center{max-width:730px;margin:0 auto;padding:0 22px;width:100%}

  /* greeting */
  .hello{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:72vh;gap:14px;text-align:center}
  .hello h1{font-family:var(--disp);font-weight:400;font-size:31px;color:var(--ink);display:flex;align-items:center;gap:12px}
  .hello h1 .star{width:26px;height:26px}

  /* messages */
  .thread{padding:24px 0 10px}
  .msg{margin-bottom:22px;animation:rise .24s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(5px)}}
  .msg .who{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);margin-bottom:6px}
  .msg.user .who{color:var(--clay)}
  .msg .body{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
  .body p{margin:.5em 0}
  .body h1,.body h2,.body h3{font-family:var(--disp);font-weight:600;margin:.7em 0 .3em;line-height:1.25}
  .body h1{font-size:1.28em}.body h2{font-size:1.13em}.body h3{font-size:1.02em}
  .body ul,.body ol{margin:.4em 0 .4em 1.25em}.body li{margin:.15em 0}
  .body code{font-family:var(--mono);font-size:.86em;background:var(--panel-2);padding:1px 5px;border-radius:5px}
  .body pre{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;margin:.6em 0}
  .body pre code{background:none;padding:0;font-size:12.5px;line-height:1.5}
  .body a{color:var(--clay)}
  .body strong{font-weight:600}
  .body table{border-collapse:collapse;margin:.6em 0;font-size:.92em;display:block;overflow-x:auto}
  .body th,.body td{border:1px solid var(--line);padding:5px 9px;text-align:left}
  .genimg{display:block;max-width:min(460px,100%);width:100%;border:1px solid var(--line);border-radius:12px;margin:10px 0;cursor:zoom-in}
  .caret{display:inline-block;width:7px;height:1em;background:var(--clay);border-radius:1px;vertical-align:-1px;margin-left:1px;animation:blink 1.1s step-end infinite}
  @keyframes blink{50%{opacity:0}}

  .tool{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:8px 0;overflow:hidden;animation:rise .24s ease both}
  .tool .h{display:flex;gap:8px;align-items:center;padding:7px 12px;font-family:var(--mono);font-size:11.5px;color:var(--slate)}
  .tool .h b{color:var(--ink);font-weight:500}
  .tool .cmd{font-family:var(--mono);font-size:11.5px;padding:0 12px 9px;color:var(--ink-2);white-space:pre-wrap;word-break:break-all}
  .gear{color:var(--clay);display:inline-block;animation:spin 2.4s linear infinite}
  .tool.done .gear{animation:none;color:var(--slate)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .think{display:flex;align-items:center;gap:9px;color:var(--slate);font-family:var(--mono);font-size:12px;margin-bottom:20px}
  .think .orb{width:7px;height:7px;border-radius:50%;background:var(--clay);animation:pulse 1.3s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}

  /* composer */
  .composer{background:var(--panel);border:1px solid var(--line);border-radius:16px;transition:border-color .16s,box-shadow .16s}
  .composer:focus-within{border-color:var(--clay);box-shadow:0 0 0 3px color-mix(in srgb,var(--clay) 15%,transparent)}
  .composer .field{padding:12px 14px 4px}
  .composer textarea{width:100%;border:none;background:none;color:var(--ink);font-family:var(--ui);font-size:14.5px;line-height:1.55;resize:none;outline:none;max-height:200px}
  .composer textarea::placeholder{color:var(--slate)}
  .composer .bar{display:flex;align-items:center;gap:8px;padding:6px 8px 8px}
  .attach{width:30px;height:30px;border:none;border-radius:9px;background:none;color:var(--slate);display:grid;place-items:center}
  .attach:hover{background:var(--panel-2);color:var(--ink)}
  .toggle{display:flex;background:var(--panel-2);border-radius:9px;padding:2px}
  .toggle button{border:none;background:none;padding:5px 11px;border-radius:7px;font-size:12.5px;color:var(--slate)}
  .toggle button.on{background:var(--raise);color:var(--ink)}
  .pick{border:none;background:none;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);padding:5px 8px;border-radius:7px;display:flex;align-items:center;gap:5px}
  .pick:hover{background:var(--panel-2);color:var(--ink)}
  .pick .c{color:var(--good)}
  .send{width:32px;height:32px;border:none;border-radius:10px;background:var(--clay);color:#fff;display:grid;place-items:center;transition:.12s}
  .send:hover{background:var(--clay-dim)}
  .send:disabled{background:var(--panel-2);color:var(--slate)}
  .dock{padding:10px 0 14px}
  .dock .center{padding-bottom:env(safe-area-inset-bottom)}

  /* side panels (obsidian / mcp / skills / files) */
  .panel{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:6}
  .panel[hidden]{display:none}
  .p-head{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line)}
  .p-head h2{font-family:var(--disp);font-weight:600;font-size:15px}
  .p-body{flex:1;overflow:auto;padding:14px 18px}
  .p-split{display:flex;height:100%;overflow:hidden}
  .p-split .tree{width:300px;flex-shrink:0;border-right:1px solid var(--line);overflow:auto;padding:10px}
  .p-split .doc{flex:1;overflow:auto;padding:22px 26px}
  .tnode{font-size:13px}
  .tnode .row{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:7px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tnode .row:hover{background:var(--panel-2);color:var(--ink)}
  .tnode .row.f{cursor:pointer}
  .tnode .kids{margin-left:13px;border-left:1px solid var(--line);padding-left:5px}
  .tnode.closed .kids{display:none}
  .card{border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:12px 14px;margin-bottom:9px}
  .card .n{font-family:var(--mono);font-size:12.5px;color:var(--ink);display:flex;align-items:center;gap:8px}
  .card .d{font-size:12px;color:var(--slate);margin-top:4px}
  .filegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .filegrid img{width:100%;border:1px solid var(--line);border-radius:10px;cursor:zoom-in}

  .toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-8px);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-family:var(--mono);font-size:12px;box-shadow:0 8px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.3s;z-index:40}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.2s;z-index:30}
  .sheet-bg.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));z-index:31;transition:transform .26s cubic-bezier(.2,.7,.3,1)}
  .sheet.show{transform:translate(-50%,0)}
  .sheet h3{font-family:var(--disp);font-weight:600;font-size:14px;margin-bottom:10px}
  .opt{display:flex;justify-content:space-between;align-items:center;padding:10px 11px;border-radius:9px;font-size:13px}
  .opt:hover{background:var(--panel-2)}
  .opt .c{color:var(--good)}

  @media (max-width:760px){
    .app{padding-top:0}
    aside{position:fixed;left:0;top:0;z-index:30;height:100%;width:min(86vw,320px);margin-left:0;
      transform:translateX(0);transition:transform .26s cubic-bezier(.2,.7,.3,1);box-shadow:16px 0 50px rgba(0,0,0,.5)}
    aside.collapsed{transform:translateX(-102%);margin-left:0}
    main{width:100%}
    .topbar{padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
    .topbar .burger{display:inline-flex}
    .topbar .ttl{font-size:13px}
    .topbar .meter{width:64px}.meter .lbl{font-size:8px}
    .center{padding:0 14px;max-width:100%}
    .hello{min-height:60vh}
    .hello h1{font-size:22px;gap:8px}.hello h1 .star{width:20px;height:20px}
    .thread{padding:16px 0 8px}
    .msg{margin-bottom:16px}
    .dock{padding:8px 0 calc(10px + env(safe-area-inset-bottom))}
    .composer textarea{font-size:16px}
    .composer .field{padding:10px 12px 2px}
    .composer .bar{gap:5px;padding:5px 6px 7px;flex-wrap:wrap}
    .composer .bar .spring{display:none}
    .toggle button{padding:5px 9px;font-size:12px}
    .pick{font-size:11px;padding:5px 6px}
    .attach{width:28px;height:28px}
    .send{width:30px;height:30px;margin-left:auto}
    .p-head{padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
    .p-split{flex-direction:column}
    .p-split .tree{width:100%;height:42%;border-right:none;border-bottom:1px solid var(--line)}
    .p-split .doc{padding:14px}
    .p-body{padding:12px 14px}
    .rail-bg{z-index:25}
  }
  .rail-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.2s;z-index:15}
  .rail-bg.show{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<div class="app">
  <aside id="rail" class="collapsed">
    <div class="s-head">
      <div class="logo"><svg class="star" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1l2.4 7.2L21.6 6 16.8 12l4.8 6-7.2-2.2L12 23l-2.4-7.2L2.4 18l4.8-6L2.4 6l7.2 2.2z"/></svg>Claude Terminal</div>
      <button class="icon-btn" id="collapse"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 18l-6-6 6-6"/></svg></button>
    </div>
    <button class="new-btn" id="newBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Yangi sessiya</button>
    <div class="nav">
      <a data-view="chat" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Suhbat</a>
      <a data-view="obsidian"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Obsidian</a>
      <a data-view="mcp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 3v6M6 15v6M18 3v6M18 15v6M6 9a3 3 0 0 0 6 0M12 9v6M12 15a3 3 0 0 0 6 0"/></svg>MCP<span class="badge" id="mcpN">·</span></a>
      <a data-view="skills"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/></svg>Skills<span class="badge" id="skN">·</span></a>
      <a data-view="files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/></svg>Fayllar</a>
    </div>
    <div class="s-label">Sessiyalar</div>
    <div class="s-list" id="sessList"></div>
    <div class="s-foot"><div class="av" id="uav">R</div><span id="uname">rey</span><span class="dot" id="udot"></span></div>
  </aside>

  <main>
    <div class="rail-bg" id="railBg"></div>
    <div class="topbar">
      <button class="icon-btn burger" id="burger"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
      <span class="ttl" id="topTtl">Suhbat</span>
      <div class="spring"></div>
      <div class="meter" id="meter" title="Kontekst"><div class="track"><div class="fill" id="mfill"></div></div><div class="lbl" id="mlbl">context</div></div>
    </div>

    <div class="scroll" id="scroll"><div class="center" id="log"></div></div>

    <div class="dock" id="dock"><div class="center"><div class="composer" id="composer">
      <div class="field"><textarea id="input" rows="1" placeholder="Bugun nima qilamiz?"></textarea></div>
      <div class="bar">
        <button class="attach" id="attach" title="Fayl (skrinshot bilan ishlash kodda)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg></button>
        <div class="toggle" id="modeTog"><button data-m="cowork" class="on">Cowork</button><button data-m="chat">Chat</button></div>
        <div class="spring"></div>
        <button class="pick" id="modelPick"><span class="c">●</span><span id="modelName">sonnet</span></button>
        <button class="pick" id="effPick"><span id="effName">medium</span></button>
        <button class="send" id="send" title="Enter"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 11l5-5 5 5M12 6v12"/></svg></button>
      </div>
    </div></div></div>

    <!-- panels -->
    <div class="panel" id="p-obsidian" hidden>
      <div class="p-head"><button class="icon-btn p-close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6L6 18M6 6l12 12"/></svg></button><h2>Obsidian Vault</h2></div>
      <div class="p-split"><div class="tree" id="vaultTree"></div><div class="doc" id="vaultDoc"><p style="color:var(--slate)">Chapdan nota tanla</p></div></div>
    </div>
    <div class="panel" id="p-mcp" hidden>
      <div class="p-head"><button class="icon-btn p-close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6L6 18M6 6l12 12"/></svg></button><h2>MCP serverlar</h2></div>
      <div class="p-body" id="mcpBody"></div>
    </div>
    <div class="panel" id="p-skills" hidden>
      <div class="p-head"><button class="icon-btn p-close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6L6 18M6 6l12 12"/></svg></button><h2>Skills</h2></div>
      <div class="p-body" id="skBody"></div>
    </div>
    <div class="panel" id="p-files" hidden>
      <div class="p-head"><button class="icon-btn p-close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6L6 18M6 6l12 12"/></svg></button><h2>Yaratilgan fayllar</h2></div>
      <div class="p-body"><div class="filegrid" id="fileGrid"></div></div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<input type="file" id="fileInput" accept="image/*" hidden>

<script type="module" src="app.js"></script>
</body>
</html>
